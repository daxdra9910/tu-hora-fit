<ion-header [translucent]="true">
  <ion-toolbar class="header-toolbar">
    <ion-title class="app-title">
      <ion-icon name="barbell-outline" class="title-icon"></ion-icon>
      Tu Hora Fit
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding home-content">

  <!-- 👋 Bienvenida -->
  <div class="welcome-section">
    <h1 class="welcome-title">
      {{ obtenerSaludo() }},
      <span class="user-name">{{ nombreUsuario | uppercase }}</span>!
    </h1>
  </div>

  <!-- 🖼️ Banner -->
  <app-banner class="banner-section"></app-banner>

  <!-- ⚡ Acciones -->
  <ion-grid class="actions-grid">
    <ion-row>
      <ion-col size="6">
        <ion-card class="action-card primary-card" (click)="irAClasesDelDia()" button>
          <ion-card-content class="card-content">
            <ion-icon name="time-outline" class="action-icon"></ion-icon>
            <h3 class="action-title">Clases del Día</h3>
          </ion-card-content>
        </ion-card>
      </ion-col>

      <ion-col size="6">
        <ion-card class="action-card secondary-card" (click)="irAEnergIA()" button>
          <ion-card-content class="card-content">
            <ion-icon name="flash-outline" class="action-icon"></ion-icon>
            <h3 class="action-title">EnergIA</h3>
          </ion-card-content>
        </ion-card>
      </ion-col>
    </ion-row>
  </ion-grid>

  <!-- 🎟️ Mis Reservas -->
  <ion-card class="reservations-card" (click)="irAMisReservas()" button>
    <ion-card-header class="reservations-header">
      <ion-icon name="ticket-outline" class="title-icon"></ion-icon>

      <div class="reservations-info">
        <h3 class="reservations-title">Mis Reservas</h3>

        <p class="reservations-text" *ngIf="reservasPendientes > 0">
          {{ reservasPendientes }} activa{{ reservasPendientes > 1 ? 's' : '' }}
        </p>

        <p class="reservations-text" *ngIf="reservasPendientes === 0">
          Sin reservas activas
        </p>
      </div>

    </ion-card-header>
  </ion-card>

  <!-- 📆 Calendario -->
  <div class="calendar-section">
    <h2 class="month-title">{{ mesActual }}</h2>

    <ion-card class="calendar-card">
      <ion-card-content class="calendar-content">
        <ion-grid class="calendar-grid">

          <!-- Días de la semana -->
          <ion-row class="week-days-row">
            <ion-col
              *ngFor="let dia of diasSemana"
              class="week-day-col"
            >
              {{ dia }}
            </ion-col>
          </ion-row>

          <!-- Días del mes -->
          <ion-row class="month-days-row">
            <div
              class="month-day-cell"
              *ngFor="let dia of diasMes"
            >
              <div
                class="day-number"
                [class.empty-day]="dia === null"
                [class.current-day]="dia !== null && esHoy(dia)"
                [class.selected-day]="dia !== null && esSeleccionado(dia)"
                (click)="dia !== null && seleccionarDia(dia)"
              >
                {{ dia }}
              </div>
            </div>
          </ion-row>

        </ion-grid>
      </ion-card-content>
    </ion-card>
  </div>


</ion-content>

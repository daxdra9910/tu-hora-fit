<ion-modal [isOpen]="isOpen">
  <ng-template>
    <ion-header>
      <ion-toolbar>
        <ion-title>Modificar cliente</ion-title>
        <ion-buttons slot="end">
          <ion-button (click)="toggleOpen()">
            <ion-icon name="close" slot="icon-only"></ion-icon>
          </ion-button>
        </ion-buttons>
      </ion-toolbar>
    </ion-header>

    <ion-content class="ion-padding">
      <form [formGroup]="form" (ngSubmit)="onSubmit()">
        <ion-list lines="none">

          <!-- Nombre -->
          <ion-item>
            <ion-input label="Nombre" labelPlacement="floating" formControlName="name" type="text" autocomplete="name"></ion-input>
          </ion-item>
          <ion-text color="danger" *ngIf="form.get('name')?.touched && form.get('name')?.invalid">
            <small class="ion-padding-start">Nombre requerido</small>
          </ion-text>

          <!-- Correo -->
          <ion-item>
            <ion-input label="Correo" labelPlacement="floating" formControlName="email" type="email" autocomplete="email"></ion-input>
          </ion-item>
          <ion-text color="danger" *ngIf="form.get('email')?.touched && form.get('email')?.invalid">
            <small class="ion-padding-start">Correo válido requerido</small>
          </ion-text>

          <!-- Teléfono -->
          <ion-item>
            <ion-input label="Teléfono" labelPlacement="floating" formControlName="phone" type="tel" autocomplete="tel"></ion-input>
          </ion-item>
          <ion-text color="danger" *ngIf="form.get('phone')?.touched && form.get('phone')?.invalid">
            <small class="ion-padding-start">Teléfono requerido</small>
          </ion-text>

          <!-- Fecha de nacimiento -->
          <ion-item>
            <ion-input label="Fecha de nacimiento" labelPlacement="floating" formControlName="birthdate" type="date" autocomplete="bday"></ion-input>
          </ion-item>
          <ion-text color="danger" *ngIf="form.get('birthdate')?.touched && form.get('birthdate')?.invalid">
            <small class="ion-padding-start">Fecha requerida</small>
          </ion-text>

          <!-- Rol -->
          <ion-item>
            <ion-select label="Rol" labelPlacement="floating" formControlName="role">
              <ion-select-option [value]="possibleRoles.ADMIN">Administrador</ion-select-option>
              <ion-select-option [value]="possibleRoles.CLIENT">Cliente</ion-select-option>
            </ion-select>
          </ion-item>
          <ion-text color="danger" *ngIf="form.get('role')?.touched && form.get('role')?.invalid">
            <small class="ion-padding-start">Rol requerido</small>
          </ion-text>

          <!-- Estado -->
          <ion-item>
            <ion-select label="Estado" labelPlacement="floating" formControlName="state">
              <ion-select-option [value]="possibleStates.ACTIVE">Activo</ion-select-option>
              <ion-select-option [value]="possibleStates.INACTIVE">Inactivo</ion-select-option>
            </ion-select>
          </ion-item>
          <ion-text color="danger" *ngIf="form.get('state')?.touched && form.get('state')?.invalid">
            <small class="ion-padding-start">Estado requerido</small>
          </ion-text>

          <!-- Imagen -->
          <ion-item>
            <ion-label>Foto</ion-label>
            <input type="file" (change)="onFileSelected($event)" accept="image/*" style="margin-left: 1rem;" />
          </ion-item>

          <!-- Vista previa -->
          <ion-item *ngIf="imagePreview">
            <ion-avatar slot="start" style="--size: 64px;">
              <img [src]="imagePreview" alt="Vista previa" style="object-fit: cover;" />
            </ion-avatar>
          </ion-item>

        </ion-list>

        <ion-button expand="block" type="submit" [disabled]="form.invalid">
          Guardar
        </ion-button>
      </form>
    </ion-content>
  </ng-template>
</ion-modal>

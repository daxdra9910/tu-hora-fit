<ion-header>
  <ion-toolbar>
    <ion-title>Enviar Notificación</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <div class="notification-container">
    <form [formGroup]="form" (ngSubmit)="onSubmit()">

      <ion-item lines="none" class="input-item">
        <ion-label position="floating">Título</ion-label>
        <ion-input formControlName="title" type="text"></ion-input>
      </ion-item>

      <ion-item lines="none" class="input-item">
        <ion-label position="floating">Mensaje</ion-label>
        <ion-textarea formControlName="body" autoGrow="true"></ion-textarea>
      </ion-item>

      <ion-button expand="block" type="submit" class="send-button" [disabled]="form.invalid">
        Enviar Notificación
      </ion-button>

    </form>
  </div>
</ion-content>

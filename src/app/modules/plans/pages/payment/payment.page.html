<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-button (click)="back()">
        <ion-icon name="arrow-back"></ion-icon>
      </ion-button>
    </ion-buttons>
    <ion-title>Pago</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>

  <div *ngIf="loading" class="loading">
    <ion-spinner></ion-spinner>
  </div>

  <ion-card *ngIf="!loading && plan">
    <ion-card-header>
      <ion-card-title>{{ plan.name }}</ion-card-title>
    </ion-card-header>

    <ion-card-content>
      <p><strong>Precio:</strong> {{ plan.price | currency:'COP' }}</p>
      <p><strong>Créditos:</strong> {{ plan.creditsTotal }}</p>

      <ion-button
        expand="block"
        color="primary"
        (click)="payWithWompi()"
        [disabled]="processing">

        <ion-spinner *ngIf="processing" slot="start"></ion-spinner>
        <ion-icon *ngIf="!processing" name="card" slot="start"></ion-icon>

        {{ processing ? 'Procesando…' : 'Pagar con Wompi' }}
      </ion-button>
    </ion-card-content>
  </ion-card>

</ion-content>
